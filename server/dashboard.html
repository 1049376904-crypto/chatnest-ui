<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatNest 控制台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e8ec;
    --dim: #9aa2b1;
    --accent: #5b8cff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 0 0 64px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,17,21,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .grow { flex: 1; }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .hint { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 5px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 11px;
    font: inherit;
    font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: #5a6272; }
  button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit; font-size: 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .row > .fixed { flex: 0 0 auto; min-width: 0; }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 10px;
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head strong { font-size: 14px; }
  .card-head .grow { flex: 1; }
  code {
    background: #10131a; padding: 1px 6px; border-radius: 4px;
    font-size: 12.5px; color: #a9b4c8;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
  }
  .tag {
    font-size: 11.5px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .tag.on { color: var(--ok); border-color: rgba(63,185,80,.4); }
  .tag.off { color: var(--dim); }
  .tag.err { color: var(--err); border-color: rgba(248,81,73,.4); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tools span {
    font-size: 12px; background: #10131a; color: #a9b4c8;
    padding: 2px 8px; border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .switch { display: flex; align-items: center; gap: 9px; margin: 12px 0; }
  .switch input { width: 17px; height: 17px; accent-color: var(--accent); }
  .switch span { font-size: 14px; }
  .switch small { display: block; color: var(--dim); font-size: 12.5px; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #232833; border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 9px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: 90vw; z-index: 100;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--err); color: #ffb4b0; }
  #toast.ok { border-color: rgba(63,185,80,.5); }
  #login { max-width: 340px; margin: 15vh auto; }
  .hide { display: none !important; }
  .muted { color: var(--dim); font-size: 13px; }
  .err-text { color: var(--err); font-size: 13px; margin-top: 6px; }
  .sep { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
</style>
</head>
<body>

<div id="login">
  <section>
    <h2>ChatNest 控制台</h2>
    <p class="hint">用聊天页面那个密码登录。</p>
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    <div style="margin-top:12px">
      <button class="primary" id="loginBtn" style="width:100%">登录</button>
    </div>
    <div class="err-text hide" id="loginErr"></div>
  </section>
</div>

<div id="app" class="hide">
  <header>
    <h1>ChatNest 控制台</h1>
    <div class="grow"></div>
    <button id="reloadBtn">热更新</button>
    <button class="primary" id="saveBtn">保存</button>
  </header>

  <main>
    <section>
      <h2>模型清单</h2>
      <p class="hint">聊天页面那个模型菜单里显示的就是这些。ID 要跟中转站的名字一字不差。</p>
      <div id="modelList"></div>
      <button id="addModel">＋ 加一个模型</button>
    </section>

    <section>
      <h2>MCP 服务</h2>
      <p class="hint">
        地址写到 <code>/mcp</code> 为止。工具清单是连上去实时拉的，不用手填。
        改完先「保存」再点「重新拉取工具」。
      </p>
      <div id="serverList"></div>
      <button id="addServer">＋ 加一个 MCP 服务</button>
      <hr class="sep">
      <div class="row">
        <button class="fixed" id="refreshTools">重新拉取工具</button>
        <div class="muted" id="toolStatus">尚未拉取</div>
      </div>
      <div id="toolDetail"></div>
    </section>

    <section>
      <h2>模型接口</h2>
      <p class="hint">留空则用 <code>server/.env</code> 里的值。</p>
      <label>Base URL<span class="muted" id="baseEff"></span></label>
      <input type="text" id="baseUrl" placeholder="https://你的中转站/v1">
      <label>API Key<span class="muted" id="keyEff"></span></label>
      <input type="password" id="apiKey" placeholder="不改就留空" autocomplete="off">
      <div class="row">
        <div>
          <label>主聊天模型</label>
          <input type="text" id="chatModel" placeholder="默认用 .env 里的">
        </div>
        <div>
          <label>摘要模型（便宜那档）</label>
          <input type="text" id="summaryModel" placeholder="默认用 .env 里的">
        </div>
      </div>
      <div class="row">
        <div>
          <label>单次最大 token</label>
          <input type="number" id="maxTokens" min="0" placeholder="0 = 用 .env">
        </div>
        <div>
          <label>历史条数</label>
          <input type="number" id="historyTurns" min="0" placeholder="0 = 用 .env">
        </div>
        <div>
          <label>超时（秒）</label>
          <input type="number" id="requestTimeout" min="0" placeholder="0 = 用 .env">
        </div>
      </div>
    </section>

    <section>
      <h2>开关</h2>
      <div class="switch">
        <input type="checkbox" id="toolsEnabled">
        <span>开启工具调用
          <small>关掉之后模型拿不到工具清单，只能纯聊天。</small>
        </span>
      </div>
      <div class="switch">
        <input type="checkbox" id="debugLog">
        <span>详细日志
          <small>把发给模型的请求、工具参数和返回全写进日志。排错时开，平时关——开着会把聊天内容写进系统日志。</small>
        </span>
      </div>
      <label>工具调用最多连续几轮</label>
      <input type="number" id="maxToolRounds" min="1" max="30">
    </section>
  </main>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var KEY = "chatnest_token";
  var token = localStorage.getItem(KEY) || "";
  var state = null;

  var $ = function (id) { return document.getElementById(id); };

  function toast(message, kind) {
    var el = $("toast");
    el.textContent = message;
    el.className = "show " + (kind || "");
    clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.className = ""; }, 3200);
  }

  function api(path, options) {
    options = options || {};
    var headers = options.headers || {};
    headers["Authorization"] = "Bearer " + token;
    if (options.body) headers["Content-Type"] = "application/json";
    return fetch(path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (response) {
      if (response.status === 401) {
        localStorage.removeItem(KEY);
        location.reload();
        throw new Error("登录已过期");
      }
      return response.json().then(function (data) {
        if (!response.ok) {
          throw new Error((data && data.detail) || ("HTTP " + response.status));
        }
        return data;
      });
    });
  }

  // ---------- 登录 ----------

  function login() {
    var value = $("password").value;
    if (!value) return;
    $("loginBtn").disabled = true;
    fetch("/api/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: value })
    }).then(function (response) {
      if (!response.ok) throw new Error("密码不对");
      return response.json();
    }).then(function (data) {
      token = data.token;
      localStorage.setItem(KEY, token);
      start();
    }).catch(function (error) {
      $("loginErr").textContent = error.message;
      $("loginErr").classList.remove("hide");
    }).finally(function () {
      $("loginBtn").disabled = false;
    });
  }

  $("loginBtn").onclick = login;
  $("password").onkeydown = function (event) {
    if (event.key === "Enter") login();
  };

  // ---------- 渲染 ----------

  function escape(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderModels() {
    var host = $("modelList");
    host.innerHTML = "";
    if (!state.models.length) {
      host.innerHTML = '<p class="muted">一个都没有。不填的话聊天页只会显示 .env 里那个默认模型。</p>';
    }
    state.models.forEach(function (model, index) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="card-head">' +
          '<strong>' + escape(model.label || model.id) + '</strong>' +
          '<div class="grow"></div>' +
          '<button class="danger" data-del="' + index + '">删除</button>' +
        '</div>' +
        '<label>模型 ID（中转站的真名）</label>' +
        '<input type="text" data-f="id" data-i="' + index + '" value="' + escape(model.id) + '">' +
        '<div class="row">' +
          '<div><label>显示名</label>' +
            '<input type="text" data-f="label" data-i="' + index + '" value="' + escape(model.label) + '"></div>' +
          '<div><label>一句说明</label>' +
            '<input type="text" data-f="desc" data-i="' + index + '" value="' + escape(model.desc) + '"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>思考档位</label>' +
            '<select data-f="thinking" data-i="' + index + '">' +
              ['none', 'adaptive', 'extended'].map(function (option) {
                return '<option value="' + option + '"' +
                  (model.thinking === option ? ' selected' : '') + '>' + option + '</option>';
              }).join('') +
            '</select></div>' +
          '<div><label>主列表显示</label>' +
            '<select data-f="primary" data-i="' + index + '">' +
              '<option value="1"' + (model.primary ? ' selected' : '') + '>是</option>' +
              '<option value="0"' + (!model.primary ? ' selected' : '') + '>折叠</option>' +
            '</select></div>' +
        '</div>';
      host.appendChild(card);
    });

    host.querySelectorAll("[data-del]").forEach(function (button) {
      button.onclick = function () {
        state.models.splice(+button.dataset.del, 1);
        renderModels();
      };
    });
    host.querySelectorAll("[data-f]").forEach(function (input) {
      input.oninput = input.onchange = function () {
        var model = state.models[+input.dataset.i];
        var field = input.dataset.f;
        if (field === "primary") model.primary = input.value === "1";
        else model[field] = input.value;
      };
    });
  }

  function renderServers() {
    var host = $("serverList");
    host.innerHTML = "";
    if (!state.mcp_servers.length) {
      host.innerHTML = '<p class="muted">还没有 MCP 服务。</p>';
    }
    state.mcp_servers.forEach(function (server, index) {
      var card = document.createElement("div");
      card.className = "card";
      var tokenNote = server.has_token
        ? '已存 ' + escape(server.token_masked) + '，不改就留空'
        : '未设置';
      card.innerHTML =
        '<div class="card-head">' +
          '<strong>' + escape(server.name) + '</strong>' +
          '<span class="tag ' + (server.enabled ? 'on">已启用' : 'off">已停用') + '</span>' +
          '<div class="grow"></div>' +
          '<button data-test="' + index + '">测试连接</button>' +
          '<button class="danger" data-del="' + index + '">删除</button>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>名字</label>' +
            '<input type="text" data-f="name" data-i="' + index + '" value="' + escape(server.name) + '"></div>' +
          '<div class="fixed"><label>启用</label>' +
            '<select data-f="enabled" data-i="' + index + '">' +
              '<option value="1"' + (server.enabled ? ' selected' : '') + '>是</option>' +
              '<option value="0"' + (!server.enabled ? ' selected' : '') + '>否</option>' +
            '</select></div>' +
        '</div>' +
        '<label>地址</label>' +
        '<input type="text" data-f="url" data-i="' + index + '" value="' + escape(server.url) + '" placeholder="https://xxx/mcp">' +
        '<label>Token<span class="muted">（' + tokenNote + '）</span></label>' +
        '<input type="password" data-f="token" data-i="' + index + '" value="" placeholder="Bearer token" autocomplete="off">' +
        '<div class="probe" data-probe="' + index + '"></div>';
      host.appendChild(card);
    });

    host.querySelectorAll("[data-del]").forEach(function (button) {
      button.onclick = function () {
        state.mcp_servers.splice(+button.dataset.del, 1);
        renderServers();
      };
    });
    host.querySelectorAll("[data-f]").forEach(function (input) {
      input.oninput = input.onchange = function () {
        var server = state.mcp_servers[+input.dataset.i];
        var field = input.dataset.f;
        if (field === "enabled") {
          server.enabled = input.value === "1";
          renderServers();
        } else {
          server[field] = input.value;
        }
      };
    });
    host.querySelectorAll("[data-test]").forEach(function (button) {
      button.onclick = function () {
        var index = +button.dataset.test;
        var server = state.mcp_servers[index];
        var slot = host.querySelector('[data-probe="' + index + '"]');
        button.disabled = true;
        slot.innerHTML = '<p class="muted">正在连…</p>';
        api("/api/admin/mcp/probe", {
          method: "POST",
          body: { url: server.url, token: server.token || "", id: server.id }
        }).then(function (data) {
          if (!data.ok) {
            slot.innerHTML = '<p class="err-text">' + escape(data.error) + '</p>';
            return;
          }
          slot.innerHTML =
            '<p class="muted">连上了，' + data.tools.length + ' 个工具：</p>' +
            '<div class="tools">' +
            data.tools.map(function (tool) {
              return '<span title="' + escape(tool.description) + '">' + escape(tool.name) + '</span>';
            }).join('') + '</div>';
        }).catch(function (error) {
          slot.innerHTML = '<p class="err-text">' + escape(error.message) + '</p>';
        }).finally(function () {
          button.disabled = false;
        });
      };
    });
  }

  function renderToolStatus(status) {
    if (!status) return;
    var parts = [];
    parts.push(status.tool_count + " 个工具");
    var names = Object.keys(status.by_server || {});
    if (names.length) parts.push(names.length + " 个服务");
    if ((status.errors || []).length) parts.push(status.errors.length + " 个失败");
    $("toolStatus").textContent = status.loaded ? parts.join(" · ") : "尚未拉取";

    var html = "";
    (status.errors || []).forEach(function (item) {
      html += '<p class="err-text">' + escape(item.server) + "：" + escape(item.error) + '</p>';
    });
    Object.keys(status.by_server || {}).forEach(function (name) {
      var tools = status.by_server[name] || [];
      html += '<div style="margin-top:10px"><div class="muted">' + escape(name) +
        "（" + tools.length + "）</div><div class=\"tools\">" +
        tools.map(function (tool) { return "<span>" + escape(tool) + "</span>"; }).join("") +
        "</div></div>";
    });
    $("toolDetail").innerHTML = html;
  }

  function fillForm() {
    $("baseUrl").value = state.openai_base_url || "";
    $("baseEff").textContent = "（当前生效：" + state.openai_base_url_effective + "）";
    $("apiKey").value = "";
    $("keyEff").textContent = "（当前：" + (state.openai_api_key_masked || "未设置") +
      (state.openai_api_key_from_env ? "，来自 .env" : "") + "）";
    $("chatModel").value = state.chat_model || "";
    $("summaryModel").value = state.summary_model || "";
    $("maxTokens").value = state.max_tokens || "";
    $("historyTurns").value = state.history_turns || "";
    $("requestTimeout").value = state.request_timeout || "";
    $("toolsEnabled").checked = !!state.tools_enabled;
    $("debugLog").checked = !!state.debug_log;
    $("maxToolRounds").value = state.max_tool_rounds || 8;
    renderModels();
    renderServers();
  }

  // ---------- 保存 ----------

  function collect() {
    var payload = {
      openai_base_url: $("baseUrl").value.trim(),
      chat_model: $("chatModel").value.trim(),
      summary_model: $("summaryModel").value.trim(),
      max_tokens: +$("maxTokens").value || 0,
      history_turns: +$("historyTurns").value || 0,
      request_timeout: +$("requestTimeout").value || 0,
      max_tool_rounds: +$("maxToolRounds").value || 8,
      tools_enabled: $("toolsEnabled").checked,
      debug_log: $("debugLog").checked,
      models: state.models,
      mcp_servers: state.mcp_servers.map(function (server) {
        return {
          id: server.id,
          name: server.name,
          url: server.url,
          token: server.token || "",
          enabled: server.enabled
        };
      })
    };
    var key = $("apiKey").value.trim();
    if (key) payload.openai_api_key = key;
    return payload;
  }

  $("saveBtn").onclick = function () {
    var button = $("saveBtn");
    button.disabled = true;
    api("/api/admin/settings", { method: "PUT", body: collect() })
      .then(function (data) {
        state = data.settings;
        fillForm();
        renderToolStatus(data.tools);
        toast("已保存并生效", "ok");
      })
      .catch(function (error) { toast(error.message, "err"); })
      .finally(function () { button.disabled = false; });
  };

  $("reloadBtn").onclick = function () {
    var button = $("reloadBtn");
    button.disabled = true;
    api("/api/admin/reload", { method: "POST" })
      .then(function (data) {
        state = data.settings;
        fillForm();
        renderToolStatus(data.tools);
        toast("已重读配置并重拉工具", "ok");
      })
      .catch(function (error) { toast(error.message, "err"); })
      .finally(function () { button.disabled = false; });
  };

  $("refreshTools").onclick = function () {
    var button = $("refreshTools");
    button.disabled = true;
    $("toolStatus").textContent = "正在拉取…";
    api("/api/admin/mcp/refresh", { method: "POST" })
      .then(function (data) {
        renderToolStatus(data);
        toast("拉到 " + data.tool_count + " 个工具", data.errors.length ? "" : "ok");
      })
      .catch(function (error) { toast(error.message, "err"); })
      .finally(function () { button.disabled = false; });
  };

  $("addModel").onclick = function () {
    state.models.push({
      id: "", label: "", desc: "", thinking: "adaptive", primary: true
    });
    renderModels();
  };

  $("addServer").onclick = function () {
    state.mcp_servers.push({
      id: "", name: "", url: "", token: "", enabled: true, has_token: false
    });
    renderServers();
  };

  // ---------- 入口 ----------

  function start() {
    api("/api/admin/settings").then(function (data) {
      state = data.settings;
      $("login").classList.add("hide");
      $("app").classList.remove("hide");
      fillForm();
      renderToolStatus(data.tools);
    }).catch(function (error) {
      $("loginErr").textContent = error.message;
      $("loginErr").classList.remove("hide");
    });
  }

  if (token) start();
})();
</script>
</body>
</html>
